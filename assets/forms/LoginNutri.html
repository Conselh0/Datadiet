<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/DataDiet.png">
  <link rel="stylesheet" href="mainCss/style.css">
  <link rel="stylesheet" href="../MainCss/style.css">
  <title>Tela de Login</title>
  <style>
    /* Fundo geral com gradiente e borda roxa */
    body {
      height: 100vh;
      display: block;
      justify-content: center;
      align-items: center;
      background:#324630;
      overflow: hidden;
      background-image: url(../img/testLT.png);
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Container branco do login */
    .login-box {
      background-color: rgba(255, 255, 255, 0.808);
      padding: 40px 50px;
      border-radius: 25px;
      box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      margin: auto;
      width: 400px;
    }

    /* Título */
    .login-box h2 {
      margin-bottom: 20px;
      color: #1C1C1C;
      font-size: 20px;
    }

    /* Campos e rótulos */
    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #1C1C1C;
    }

    input[type="number"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #999;
      border-radius: 2px;
      font-size: 14px;
    }

    /* Botão */
    .btn {
      background-color: #216537;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 40px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #1a512c;
    }

    .back:hover{
      transition: 1.1s;
      transform: scale(1.1);
    }

  </style>
</head>
<body>
  <a href="/index.html"><img src="/assets/img/icons/left-arrow.png" alt="seta de saída" width="3%" class="back"></a>
  <div class="login-box">
    <h2>INSIRA SEU LOGIN</h2>
    <form>
      <label for="number">Digite seu CRN:</label>
      <input type="number" id="CRN" name="CRN">

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha">
    </form>
    <a href="/perfilAdm.html"><button class="btn">ENTRAR</button></a>
  </div>
</body>
</html>
