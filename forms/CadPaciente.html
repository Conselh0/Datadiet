<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/DataDiet.png">
  <link rel="stylesheet" href="mainCss/style.css">
  <link rel="stylesheet" href="../MainCss/style.css">
  <title>Formulário de Cadastro</title>
  <style>
    /* Fundo com gradiente e borda roxa */
    body {
      height: 100vh;
      display: block;
      justify-content: center;
      align-items: center;
      background: #324630;
      background-image: url(../img/testLT.png);
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* Caixa branca central */
    .cadastro-box {
      background-color: rgba(255, 255, 255, 0.808);
      padding: 40px 50px;
      border-radius: 25px;
      box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 400px;
      margin: auto;
    }

    /* Título */
    .cadastro-box h2 {
      margin-bottom: 20px;
      color: #1C1C1C;
      font-size: 20px;
    }

    /* Rótulos */
    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #1C1C1C;
    }

    /* Campos de entrada */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    input[type="tel"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #999;
      border-radius: 2px;
      font-size: 14px;
    }

    /* Botão */
    .btn {
      background-color: #216537;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 40px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #1a512c;
    }

    .back:hover{
      transition: 1.1s;
      transform: scale(1.1);
    }

  </style>
</head>
<body>
  <a href="../index.html"><img src="../img/left-arrow.png" class="back" width="3%"></a>
  <div class="cadastro-box">
    <h2>CADASTRE-SE</h2>
    <form>
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="data">Data de nascimento:</label>
      <input type="date" id="data" name="data" required>

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>
    </form>
    <a href="../forms/LoginPaciente.html"><button type="submit" class="btn">CADASTRAR</button></a>
  </div>
</body>
</html>
