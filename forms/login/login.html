<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    
    <main id="form_container">
        <div id="form_header">
            <h1 id="form_title">
                Entrar
            </h1>
            
        </div>

        <form action="" id="form">
            <div id="input_container">
                <div class="input-box">
                    
                <div class="input-box">
                    <label 
                        for="email" 
                        class="form-label"
                    >
                        E-mail
                    </label>
                    <div class="input-field">
                        <input 
                            type="email"
                            name="email"
                            id="email"
                            class="form-control"
                            placeholder="seu@email.com"
                        >
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <span class="error"></span>
                </div>

                <div class="input-box">
                    <label 
                        for="password" 
                        class="form-label"
                    >
                        Senha
                    </label>
                    <div class="input-field">
                        <input 
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Digite sua senha"
                        >
                        <i class="fa-regular fa-eye-slash password-icon"></i>
                    </div>

                 <a href="google.com" class="forget_password"> Esqueceu a senha?</a>
                    <span class="error"></span>
                </div>

                    <span class="error"></span>
                </div>
                               
            <button type="submit" class="btn-default">
              
                Entrar
                
            </button>

            <a href="/Formulário/criarconta/criarconta.html">Criar conta</a>

        </form>
       
            <a href="/forms/fichadeanamnese/ficha.html">Ficha rapidão</a>
        
    </main>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

    <script src="login.js"></script>

    
</body>
</html>
